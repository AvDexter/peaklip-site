  <div class="wrap nav">
    <a class="brand" href="./" aria-label="Peaklip home"><img src="assets/logo.svg" alt="" width="30" height="30">Peaklip</a>

<main id="main" class="wrap">
  <article class="legal checkout" aria-live="polite">
    <h1 id="co-title">Starting your plan…</h1>
    <p id="co-text">The secure payment form opens in a moment. Payments are handled by Paddle, our reseller —
      Peaklip never sees your card.</p>
    <p class="updated"><a href="terms.html">Terms</a> · <a href="refunds.html">Refund policy</a> ·
      <a href="privacy.html">Privacy</a></p>
  </article>
</main>
<script src="assets/paddle-config.js?v=1"></script>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script>
(function () {
  var title = document.getElementById("co-title"), text = document.getElementById("co-text");
  function say(t, x) { title.textContent = t; text.textContent = x; }
  var cfg = window.PEAKLIP_PADDLE || {}, txn = new URLSearchParams(location.search).get("_ptxn");
  if (!txn) { say("Choose a plan in the app", "Open Peaklip and go to Settings → Plan & credits to start your free trial or pick a plan."); return; }
  if (!cfg.token || !window.Paddle) { say("Payments open soon", "Checkout isn't switched on yet. Please try again later."); return; }
  if (cfg.token.indexOf("test_") === 0) { Paddle.Environment.set("sandbox"); }
  Paddle.Initialize({
    token: cfg.token,
    eventCallback: function (e) {
      if (e.name === "checkout.completed") {
        say("You're all set", "Go back to Peaklip — your plan and credits show up in Settings → Plan & credits within a minute.");
      } else if (e.name === "checkout.closed") {
        say("Checkout closed", "Nothing was charged. You can start again from Peaklip: Settings → Plan & credits.");
      }
    }
  });
})();
</script>
